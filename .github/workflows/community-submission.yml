name: Community parser submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: billy-parser-community-writes
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.issue.body || '', '<!-- billy-parser-submission:v2 -->')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate submission
        id: process
        continue-on-error: true
        run: |
          python scripts/publish_submission.py \
            --event "$GITHUB_EVENT_PATH" \
            --result "$RUNNER_TEMP/billy-community-result.json"

      - name: Read result
        id: result
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'billy-community-result.json'
          data = json.loads(path.read_text()) if path.exists() else {
              'ok': False,
              'message': 'Submission processor stopped before producing a result.'
          }
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as handle:
              for key in ('ok', 'message', 'parser_id', 'version', 'already_processed'):
                  value = str(data.get(key, '')).replace('\r', ' ').replace('\n', ' | ')
                  handle.write(f'{key}={value}\n')

      - name: Test repository
        id: tests
        if: steps.process.outcome == 'success'
        run: |
          python scripts/build_catalog.py --check
          pytest -q

      - name: Commit parser and catalogs
        if: steps.process.outcome == 'success'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add parsers
          if ! git diff --cached --quiet; then
            git commit -m 'community: publish parser submission'
          fi

          BILLY_SOURCE_COMMIT="$(git rev-parse HEAD)" python scripts/build_catalog.py
          git add parser.json catalog
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update parser catalogs'
          fi

          if git push origin HEAD:main; then
            echo 'mode=direct' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="community/submission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title 'Community parser submission' --body 'Automated Billy parser submission. No manual review is required.')"
          gh pr merge "$pr_url" --auto --squash --delete-branch
          echo 'mode=pull-request' >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Label and close issue
        if: always() && (steps.process.outcome == 'success' || steps.process.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.result.outputs.ok }}
          MESSAGE: ${{ steps.result.outputs.message }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const validated = process.env.OK === 'True' || process.env.OK === 'true';
            const accepted = validated && process.env.PUBLISH_OUTCOME === 'success';
            const message = accepted
              ? process.env.MESSAGE
              : validated
                ? 'Automated publication failed during repository tests or push.'
                : process.env.MESSAGE;
            const labels = [
              ['parser-submission', '0969da'],
              [accepted ? 'community-accepted' : 'community-rejected', accepted ? '0e8a16' : 'd73a4a']
            ];
            for (const [name, color] of labels) {
              try {
                await github.rest.issues.createLabel({owner: context.repo.owner, repo: context.repo.repo, name, color});
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: labels.map(([name]) => name)
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${accepted ? '✅ Accepted' : '❌ Rejected'}\n\n${message || 'No result message.'}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
