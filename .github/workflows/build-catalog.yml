name: Build parser catalog

on:
  push:
    branches: [main]
    paths:
      - 'parsers/**'
      - 'feedback/**'
      - 'schema/**'
      - 'scripts/build_catalog.py'
      - 'scripts/community_policy.py'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billy-parser-community-writes
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_catalog.py --check
      - name: Build and publish generated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            python scripts/build_catalog.py
            git add parser.json catalog

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m 'chore: update parser catalogs'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Catalog push raced with another main update; retrying ($attempt/3)..."
          done

          echo 'Failed to publish generated catalogs after 3 attempts.' >&2
          exit 1
