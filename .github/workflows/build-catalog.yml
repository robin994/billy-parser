name: Build parser catalog

on:
  push:
    branches: [main]
    paths:
      - 'parsers/**'
      - 'schema/**'
      - 'scripts/build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_catalog.py
      - name: Commit generated catalogs
        run: |
          if git diff --quiet -- parser.json catalog; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parser.json catalog
          git commit -m 'chore: update parser catalogs'
          git push
