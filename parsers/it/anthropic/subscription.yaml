schema: 1
id: it.anthropic.subscription
version: 2

metadata:
  name: Anthropic - Claude subscription
  country: IT
  language: en
  provider: Anthropic
  bill_type: subscription
  homepage: https://www.anthropic.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.11.3

prefilter:
  email:
    from:
      - invoice+statements@mail.anthropic.com
    subject_regex:
      - '(?i)^Your\s+(?:receipt|invoice)\s+from\s+Anthropic(?:,\s*PBC)?\b'
      - '(?i)\b(?:invoice|receipt)\b.*\bAnthropic\b'

detection:
  threshold: 70
  rules:
    - source: email.from
      equals: invoice+statements@mail.anthropic.com
      weight: 60
    - source: email.subject
      regex: '(?i)^Your\s+(?:receipt|invoice)\s+from\s+Anthropic(?:,\s*PBC)?\b'
      weight: 35
    - source: email.body
      regex: '(?i)\bAnthropic,?\s+PBC\b'
      weight: 20
    - source: email.body
      regex: '(?i)\bClaude\s+(?:Pro|Max|Team|Enterprise)\b'
      weight: 20
    - source: attachment.filename
      regex: '(?i)^(?:Invoice|Receipt)-[A-Z0-9-]+\.pdf$'
      weight: 20
    - source: attachment.mime_type
      equals: application/pdf
      weight: 5

documents:
  email:
    enabled: true
  attachments:
    - id: billing_pdf
      mime_types:
        - application/pdf
      filename_regex: '(?i)^(?:Invoice|Receipt)-[A-Z0-9-]+\.pdf$'
      extractor: pdf_text
      required: true

fields:
  provider:
    value: Anthropic

  bill_type:
    value: subscription

  currency:
    value: EUR

  invoice_number:
    required: true
    candidates:
      - source: billing_pdf
        regex: '(?i)Invoice\s+number\s+(?P<value>[A-Z0-9][A-Z0-9-]{2,})'
    transform:
      type: text

  issue_date:
    candidates:
      - source: billing_pdf
        regex: '(?i)Date\s+of\s+issue\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%B %d, %Y'

  due_date:
    candidates:
      - source: billing_pdf
        regex: '(?i)Date\s+due\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
      - source: billing_pdf
        regex: '(?i)\b(?:USD|EUR|GBP|\$|€|£)?\s*[0-9.,]+\s+due\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%B %d, %Y'

  payment_date:
    candidates:
      - source: billing_pdf
        regex: '(?i)Date\s+paid\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
      - source: billing_pdf
        regex: '(?i)\bpaid\s+on\s+(?P<value>[A-Z][a-z]+\s+\d{1,2},\s+\d{4})'
    transform:
      type: date
      locale: en_US
      formats:
        - '%B %d, %Y'

  amount:
    required: true
    candidates:
      - source: billing_pdf
        regex: '(?i)Amount\s+due\s*[€$£]?\s*(?P<value>\d{1,3}(?:[.,]\d{3})*[.,]\d{2})'
      - source: billing_pdf
        regex: '(?i)Amount\s+paid\s*[€$£]?\s*(?P<value>\d{1,3}(?:[.,]\d{3})*[.,]\d{2})'
      - source: billing_pdf
        regex: '(?i)Total\s*[€$£]?\s*(?P<value>\d{1,3}(?:[.,]\d{3})*[.,]\d{2})'
    transform:
      type: decimal
      locale: en_US

  offer:
    candidates:
      - source: billing_pdf
        regex: '(?im)^\s*(?P<value>Claude\s+(?:Pro|Max|Team|Enterprise))\s*$'
    transform:
      type: text

  period:
    candidates:
      - source: billing_pdf
        regex: '(?i)(?P<start>[A-Z][a-z]{2}\s+\d{1,2})[–-](?P<end>[A-Z][a-z]{2}\s+\d{1,2},\s+\d{4})'
    outputs:
      - period_start
      - period_end
    transform:
      type: date_range
      locale: en_US
      start_group: start
      end_group: end
      infer_missing_year: true

  payment_method:
    candidates:
      - source: billing_pdf
        regex: '(?i)Payment\s+method\s+Date\s+Amount\s+paid\s+Receipt\s+number\s+(?P<value>(?:Visa|Mastercard|American\s+Express|Amex)\s*-\s*\d{4})'
    transform:
      type: text

  receipt_number:
    candidates:
      - source: billing_pdf
        regex: '(?i)Receipt\s+number\s+(?P<value>[0-9]{4}-[0-9]{4}-[0-9]{4})'
    transform:
      type: text
