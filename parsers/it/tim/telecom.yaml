schema: 1
id: it.tim.telecom
version: 1
metadata:
  name: TIM
  country: IT
  language: it
  provider: TIM
  bill_type: internet
  min_billy_version: 0.6.0
  status: outdated
  quality: experimental
  replacement: it.tim.internet
prefilter:
  email:
    subject_regex:
      - '(?i)\b(?:tim|telecom\s+italia)\b'
detection:
  threshold: 60
  rules:
    - source: email.subject
      regex: '(?i)\b(?:tim|telecom\s+italia)\b'
      weight: 40
    - source: email.body
      regex: '(?i)\b(?:tim|telecom\s+italia)\b'
      weight: 60
    - source: attachment.filename
      regex: '(?i)(?:tim|conto|fattura).*\.pdf$'
      weight: 10
documents:
  email:
    enabled: true
  attachments:
    - id: bill_pdf
      required: false
      mime_types: [application/pdf]
      filename_regex: '(?i).*\.pdf$'
      extractor: pdf_text
fields:
  provider:
    value: TIM
  currency:
    value: EUR
  amount:
    required: true
    candidates:
      - source: email
        regex: '(?i)(?:totale\s+da\s+pagare|importo\s+da\s+pagare|totale\s+(?:conto|fattura))\s*[:€\s]*?(?P<value>\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})'
      - source: bill_pdf
        regex: '(?i)(?:totale\s+da\s+pagare|importo\s+da\s+pagare|totale\s+(?:conto|fattura))\s*[:€\s]*?(?P<value>\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})'
    transform:
      type: decimal
      locale: it_IT
verification:
  - field: amount
    sources: [email, bill_pdf]
