schema: 1
id: us.blackhillsenergy.energy
version: 1
metadata:
  name: Black Hills Energy
  country: US
  language: en
  provider: Black Hills Energy
  bill_type: energy
  homepage: https://www.blackhillsenergy.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0
  submitted_by: tficken
prefilter:
  email:
    from:
    - customerservice@email.blackhillsenergy.com
    subject_contains:
    - bill is available
detection:
  threshold: 70
  rules:
  - source: email.from
    equals: customerservice@email.blackhillsenergy.com
    weight: 60
  - source: email.subject
    regex: (?i)^Your\s+Black\s+Hills\s+Energy\s+bill\s+is\s+available
    weight: 35
  - source: email.body
    regex: (?i)recent\s+energy\s+bill\s+is\s+ready
    weight: 20
documents:
  email:
    enabled: true
  attachments: []
fields:
  provider:
    value: Black Hills Energy
  bill_type:
    value: energy
  currency:
    value: USD
  amount:
    required: true
    candidates:
    - source: email
      regex: (?is)Amount\s+due:\s*\$\s*(?P<value>[0-9,]+\.[0-9]{2})
    transform:
      type: decimal
      locale: en_US
  due_date:
    required: true
    candidates:
    - source: email
      regex: (?i)Due\s+date:\s*(?P<value>\d{1,2}/\d{1,2}/\d{4})
    - source: email
      regex: (?i)payment\s+is\s+due\s+on\s+(?P<value>\d{1,2}/\d{1,2}/\d{4})
    transform:
      type: date
      locale: en_US
      formats:
      - '%m/%d/%Y'
  issue_date:
    candidates:
    - source: email
      regex: (?i)Bill\s+date:\s*(?P<value>\d{1,2}/\d{1,2}/\d{4})
    transform:
      type: date
      locale: en_US
      formats:
      - '%m/%d/%Y'
  customer_code:
    candidates:
    - source: email
      regex: (?i)Account\s+number:\s*(?P<value>\d+)
    transform:
      type: text
