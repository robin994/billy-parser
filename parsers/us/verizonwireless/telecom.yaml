schema: 1
id: us.verizonwireless.telecom
version: 1
metadata:
  name: Verizon Wireless
  country: US
  language: en
  provider: Verizon Wireless
  bill_type: telecom
  homepage: https://www.verizon.com/
  status: experimental
  quality: experimental
  min_billy_version: 0.6.0
  submitted_by: tficken
prefilter:
  email:
    from:
    - VZWMail@ecrmemail.verizonwireless.com
    subject_contains:
    - bill is ready
detection:
  threshold: 70
  rules:
  - source: email.from
    equals: VZWMail@ecrmemail.verizonwireless.com
    weight: 60
  - source: email.subject
    regex: (?i)^Your\s+Verizon\s+bill\s+is\s+ready
    weight: 35
  - source: email.body
    regex: (?i)Total\s+amount\s+due
    weight: 20
documents:
  email:
    enabled: true
  attachments: []
fields:
  provider:
    value: Verizon Wireless
  bill_type:
    value: telecom
  currency:
    value: USD
  amount:
    required: true
    candidates:
    - source: email
      regex: (?is)Total\s+amount\s+due:\s*\$\s*(?P<value>[0-9,]+\.[0-9]{2})
    transform:
      type: decimal
      locale: en_US
  due_date:
    required: true
    candidates:
    - source: email
      regex: (?is)Auto\s+Pay\s+date:\s*(?P<value>\d{1,2}/\d{1,2}/\d{4})
    transform:
      type: date
      locale: en_US
      formats:
      - '%m/%d/%Y'
  customer_code:
    candidates:
    - source: email
      regex: (?i)Account\s+number\s+ending\s+in:\s*(?P<value>[0-9-]+)
    transform:
      type: text
